(() => {
  const copy = {
    es: {
      description: 'Fotografías y proyectos de 2o052o05.',

      ],
    },
    en: {
      description: 'Photographs and projects by 2o052o05.',
      gallery: 'Photographs',
      beatpost: 'Beatpost by 2o05',
      signal: 'TV and audio signal',
      spectrum: 'Microsound spectrogram',
      projects: 'Navigation',
      contact: 'Contact',
      commercial: 'BUY THE NEW STASH KITS BY "2o"!!! NEW AND UPDATED, NOW AT A REDUCED PRICE, CALL 0800-PRESAGE-2o05 AND ORDER YOURS RIGHT NOW!!! TERMS AND CONDITIONS APPLY.',
      photos: [
        'Building and overhead wires illuminated at night',
        'Detail of a black T-shirt with white embroidery',
        'Black sneakers with blue details',
        'Screenshot of black sneakers and lighters with the original photo information',
        'Clear CD case with Presagios artwork and Luca Mateo’s signature'
      ],
    }
  };
  const photos = ['IMG_1416.jpeg', 'IMG_7367.jpeg', 'IMG_8890.jpeg', 'IMG_8894.jpg', 'gem.jpg'];

  function preferredLocale() {
    const languages = [navigator.language, ...(navigator.languages || [])];
    const locales = languages.flatMap(language => {
      if (typeof language !== 'string' || !language) return [];
      try { return Intl.getCanonicalLocales(language); }
      catch { return []; }
    });
    return locales.find(locale => /^en(-|$)/i.test(locale))
      || locales.find(locale => /^es(-|$)/i.test(locale))
      || 'en';
  }

  function setText(selector, text) {
    const element = document.querySelector(selector);
    if (element) element.textContent = text;
  }

  function setAttribute(selector, attribute, value) {
    const element = document.querySelector(selector);
    if (element) element.setAttribute(attribute, value);
  }

  function localize() {
    const locale = preferredLocale();
    const language = locale.split('-')[0];
    const text = copy[language];
    document.documentElement.lang = language;
    setAttribute('meta[name="description"]', 'content', text.description);
    setAttribute('.gallery', 'aria-label', text.gallery);
    setAttribute('.beatpost', 'aria-label', text.beatpost);
    setAttribute('.beatpost .info', 'aria-label', text.signal);
    setAttribute('.espectrograma', 'aria-label', text.spectrum);
    setAttribute('aside nav', 'aria-label', text.projects);
    setText('button[data-photo="assets/foto1.jpg"] .barcode-caption', text.contact);
    document.querySelectorAll('.tv-ticker-track span').forEach(element => { element.textContent = text.commercial; });
    photos.forEach((photo, index) => {
      setAttribute(`.gallery img[src$="/${photo}"]`, 'alt', text.photos[index]);
    });
    const dates = new Intl.DateTimeFormat(locale, {
      day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC',
      calendar: 'gregory', numberingSystem: 'latn'
    });
    document.querySelectorAll('.gallery time[datetime]').forEach(element => {
      const value = element.getAttribute('datetime');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return;
      const date = new Date(`${value}T12:00:00Z`);
      if (Number.isNaN(date.getTime())) return;
      element.textContent = dates.formatToParts(date)
        .filter(part => ['day', 'month', 'year'].includes(part.type))
        .map(part => part.value).join(' ');
    });
  }

  localize();
  window.addEventListener('languagechange', localize);
})();

(() => {
  const beatpost = document.querySelector('.beatpost');
  const container = beatpost.querySelector('.azul');
  const cartel = beatpost.querySelector('.cartel');
  const hdmi = beatpost.querySelector('.hdmi');
  const video = beatpost.querySelector('.video');
  const photo = beatpost.querySelector('.monitor-photo');
  const comingSoon = beatpost.querySelector('.coming-soon');
  const buttons = [...document.querySelectorAll('nav button[data-screen]')];
  const canvas = beatpost.querySelector('#espectrograma');
  const ctx = canvas.getContext('2d');
  const fpsInfo = beatpost.querySelector('#fps-info');
  const colorInfo = beatpost.querySelector('#color-info');
  const bitsInfo = beatpost.querySelector('#bits-info');
  const levelInfo = beatpost.querySelector('#nivel');
  const frequencyInfo = beatpost.querySelector('#frecuencia');
  const clockInfo = beatpost.querySelector('#hora');
  const noise = beatpost.querySelector('.tv-noise');
  const noiseContext = noise.getContext('2d', { alpha: false });
  let noiseFrame;
  let noisePixels;
  let noiseAnimation = 0;
  let lastNoiseFrame = -Infinity;
  let noiseSeed = (Math.random() * 0xffffffff) >>> 0 || 1;

  function resizeNoise() {
    const width = Math.max(1, Math.min(640, Math.round(container.clientWidth * 0.8)));
    const height = Math.max(1, Math.round(width * container.clientHeight / Math.max(1, container.clientWidth)));
    if (noiseFrame && noise.width === width && noise.height === height) return;
    noise.width = width;
    noise.height = height;
    noiseFrame = noiseContext.createImageData(width, height);
    noisePixels = new Uint32Array(noiseFrame.data.buffer);
  }

  function drawNoise(now = performance.now()) {
    cancelAnimationFrame(noiseAnimation);
    if (beatpost.dataset.screen !== 'static') return;
    if (!document.hidden && now - lastNoiseFrame >= 1000 / 30) {
      lastNoiseFrame = now;
      resizeNoise();
      for (let i = 0; i < noisePixels.length; i++) {
        noiseSeed ^= noiseSeed << 13;
        noiseSeed ^= noiseSeed >>> 17;
        noiseSeed ^= noiseSeed << 5;
        const shade = 20 + ((noiseSeed >>> 0) % 210);
        noisePixels[i] = (0xff000000 | shade * 0x010101) >>> 0;
      }
      noiseContext.putImageData(noiseFrame, 0, 0);
    }
    noiseAnimation = requestAnimationFrame(drawNoise);
  }

  const visualScale = 6;
  const spectrumDuration = 103.83675;
  const fps = 2;
  const speed = 10;
  const visualStartedAt = performance.now();
  canvas.width = 960;
  canvas.height = 300;
  const spectrum = new Image();
  let hasSignal = false;
  let mode = 'normal';
  let screenTimer = 0;
  let hdmiTimer = 0;
  let selection = 0;
  let waitingForVideo = false;
  const pictures = new Map(buttons.filter(button => button.dataset.photo).map(button => {
    const picture = new Image();
    picture.src = button.dataset.photo;
    return [button, picture];
  }));

  function playbackTime() {
    const elapsed = Math.max(0, (performance.now() - visualStartedAt) / 1000);
    return elapsed % spectrumDuration;
  }

  function drawSpectrum() {
    if (!spectrum.complete || !spectrum.naturalWidth || document.hidden) return;
    const width = canvas.width;
    const height = canvas.height;
    const sourceWidth = spectrum.naturalWidth / visualScale;
    const sourceX = playbackTime() / spectrumDuration * spectrum.naturalWidth;
    const firstWidth = Math.min(sourceWidth, spectrum.naturalWidth - sourceX);
    const firstDestinationWidth = firstWidth / sourceWidth * width;
    ctx.drawImage(spectrum, sourceX, 0, firstWidth, spectrum.naturalHeight, 0, 0, firstDestinationWidth, height);
    if (firstWidth < sourceWidth) {
      ctx.drawImage(spectrum, 0, 0, sourceWidth - firstWidth, spectrum.naturalHeight, firstDestinationWidth, 0, width - firstDestinationWidth, height);
    }
  }

  function signalData(showVideo) {
    fpsInfo.textContent = showVideo ? '30 FPS' : `${fps} FPS`;
    colorInfo.textContent = showVideo ? 'RGB' : 'YCbCr 4:2:2';
    bitsInfo.textContent = showVideo ? '10-bit' : '8-bit';
  }

  const random = (min, max) => min + Math.random() * (max - min);

  function clearTimers() {
    clearTimeout(screenTimer);
    clearTimeout(hdmiTimer);
  }

  function showHdmi() {
    clearTimeout(hdmiTimer);
    hdmi.hidden = false;
    hdmiTimer = setTimeout(() => { hdmi.hidden = true; }, 1000);
  }

  function staticScreen(next = blueScreen, duration = 1000) {
    clearTimers();
    beatpost.dataset.screen = 'static';
    beatpost.classList.add('static');
    drawNoise();
    cartel.style.visibility = 'hidden';
    hdmi.hidden = true;
    screenTimer = setTimeout(next, duration);
  }

  function blueScreen() {
    if (mode !== 'normal') return;
    clearTimers();
    beatpost.dataset.screen = 'blue';
    photo.hidden = true;
    container.classList.remove('show-drumkits');
    comingSoon.hidden = true;
    beatpost.classList.remove('static');
    container.classList.remove('con-senal');
    hasSignal = false;
    signalData(false);
    cartel.style.visibility = 'visible';
    hdmi.hidden = true;
    screenTimer = setTimeout(videoScreen, random(7000, 16000));
  }

  function videoScreen() {
    if (mode !== 'normal') return;
    clearTimers();
    if (video.readyState < 2 || video.paused) {
      waitingForVideo = true;
      video.play().catch(() => {});
      return;
    }
    waitingForVideo = false;
    beatpost.dataset.screen = 'video';
    comingSoon.hidden = true;
    photo.hidden = true;
    container.classList.remove('show-drumkits');
    hasSignal = true;
    signalData(true);
    beatpost.classList.remove('static');
    container.classList.add('con-senal');
    cartel.style.visibility = 'hidden';
    showHdmi();
    screenTimer = setTimeout(() => staticScreen(), random(5000, 6000));
  }

  function resumeCycle() {
    ++selection;
    mode = 'normal';
    buttons.forEach(button => button.setAttribute('aria-pressed', 'false'));
    staticScreen(videoScreen);
  }

  function showPhoto(button) {
    if (button.getAttribute('aria-pressed') === 'true') {
      resumeCycle();
      return;
    }
    const version = ++selection;
    mode = 'option';
    waitingForVideo = false;
    hasSignal = true;
    buttons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    staticScreen(async () => {
      const picture = pictures.get(button);
      try { if (picture) await picture.decode(); }
      catch {
        if (version === selection) resumeCycle();
        return;
      }
      if (version !== selection) return;
      comingSoon.hidden = Boolean(picture);
      if (picture) photo.src = picture.src;
      photo.alt = button.textContent.trim();
      const drumkits = button.dataset.screen === 'drumkits';
      photo.hidden = drumkits || !picture;
      container.classList.toggle('show-drumkits', drumkits);
      beatpost.dataset.screen = 'photo';
      beatpost.classList.remove('static');
      container.classList.add('con-senal');
      signalData(true);
      fpsInfo.textContent = '0 FPS';
      bitsInfo.textContent = '8-bit';
      showHdmi();
      screenTimer = setTimeout(resumeCycle, button.dataset.screen === 'contact' ? 10000 : 60000);
    }, 600);
  }


  function showComingSoon() {
    const version = ++selection;
    staticScreen(() => {
      if (version !== selection) return;
      photo.hidden = true;
      container.classList.remove('show-drumkits');
      comingSoon.hidden = false;
      beatpost.classList.remove('static');
      beatpost.dataset.screen = 'coming-soon';
      showHdmi();
      screenTimer = setTimeout(resumeCycle, 60000);
    }, 600);
  }
  beatpost.querySelectorAll('[data-kit]').forEach(button => button.addEventListener('click', showComingSoon));

  buttons.forEach(button => button.addEventListener('click', () => showPhoto(button)));
  video.addEventListener('playing', () => {
    if (waitingForVideo && mode === 'normal') videoScreen();
  });

  let x = 0;
  let y = 0;
  let directionX = 1;
  let directionY = 1;
  let limitX = 0;
  let limitY = 0;

  function drawSign() {
    cartel.style.transform = `translate(${x}px, ${y}px)`;
  }

  function resize() {
    limitX = Math.max(0, container.clientWidth - cartel.offsetWidth);
    limitY = Math.max(0, container.clientHeight - cartel.offsetHeight);
    x = Math.min(x, limitX);
    y = Math.min(y, limitY);
    drawSign();
  }

  function updateData() {
    clockInfo.textContent = new Date().toLocaleTimeString(document.documentElement.lang, { hour12: false });
  }

  levelInfo.textContent = '−∞ dBFS';
  frequencyInfo.textContent = '— Hz';
  video.muted = true;
  video.loop = true;
  video.disableRemotePlayback = true;
  video.disablePictureInPicture = true;
  videoScreen();
  resize();
  x = limitX / 2;
  y = limitY / 2;
  drawSign();
  new ResizeObserver(resize).observe(container);

  setInterval(() => {
    if (document.hidden || hasSignal) return;
    x += directionX * speed / fps;
    y += directionY * speed * 0.65 / fps;
    if (x <= 0 || x >= limitX) {
      x = Math.max(0, Math.min(x, limitX));
      directionX *= -1;
    }
    if (y <= 0 || y >= limitY) {
      y = Math.max(0, Math.min(y, limitY));
      directionY *= -1;
    }
    drawSign();
  }, 1000 / fps);

  document.addEventListener('visibilitychange', () => {
    drawSpectrum();
    if (!document.hidden && video.paused) video.play().catch(() => {});
  });
  setInterval(drawSpectrum, 33);
  setInterval(updateData, 1000);
  updateData();
  spectrum.decoding = 'async';
  spectrum.onload = drawSpectrum;
  spectrum.src = 'assets/spectrum.png';
})();

const sidebar = document.querySelector('aside');
const beatpost = document.querySelector('.beatpost');
const mobileLayout = matchMedia('(max-width: 820px)');
const fixedContent = [...sidebar.children].filter(element => element !== beatpost);

function fitBeatpost() {
  if (mobileLayout.matches) {
    sidebar.style.removeProperty('--beatpost-size');
    return;
  }
  const style = getComputedStyle(sidebar);
  let available = sidebar.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
  for (const element of fixedContent) {
    const spacing = getComputedStyle(element);
    available -= element.getBoundingClientRect().height + parseFloat(spacing.marginTop) + parseFloat(spacing.marginBottom);
  }
  const spacing = getComputedStyle(beatpost);
  available -= parseFloat(spacing.marginTop) + parseFloat(spacing.marginBottom);
  sidebar.style.setProperty('--beatpost-size', `${Math.max(0, Math.floor(available * 4 / 3))}px`);
}

mobileLayout.addEventListener('change', fitBeatpost);
const layoutObserver = new ResizeObserver(fitBeatpost);
[sidebar, ...fixedContent].forEach(element => layoutObserver.observe(element));
fitBeatpost();

const gallery = document.querySelector('.gallery');
setInterval(() => {
  gallery.classList.toggle('monochrome');
}, 10000);

for (const event of ['selectstart', 'dragstart', 'contextmenu']) {
  document.addEventListener(event, event => event.preventDefault());
}

Promise.allSettled([
  document.fonts.ready,
  ...[...sidebar.querySelectorAll('h1 img, nav img')].map(image => image.decode())
]).then(() => {
  fitBeatpost();
  requestAnimationFrame(() => {
    fitBeatpost();
    document.documentElement.classList.remove('loading');
  });
});
    </script>
  </body>
</html>
